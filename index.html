<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Compatibility shim for browser extensions monkeypatching window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var pFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return pFetch; },
                set: function(val) { pFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }

        // Prevent external extension errors from bubbling to app root
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
          }
        });
      })();
    </script>
    <title>EcoVisual - Plataforma Educativa Ambiental</title>
    <meta name="description" content="Prototipo interactivo de EcoVisual: plataforma educativa ambiental con contenidos visuales, módulos de reciclaje, actividades interactivas y recursos descargables." />
